<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian Atlas</title>
<meta name="description" content="An interactive globe, country dossiers, a geography course and spaced-repetition practice.">
<script>
  // Dark is the default; apply a saved light choice before first paint.
  try { if (localStorage.getItem('meridian-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  // Load web fonts without holding up the first paint; text shows in the fallback face for a moment.
  (function () { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&family=Geologica:wght@300;400;500;600&display=swap'; document.head.appendChild(l); })();
</script>
<link rel="stylesheet" href="css/app.css">

</head>
<body>
<div class="shell" id="shell">
  <header class="topbar">
    <a class="brand" href="#explore" aria-label="Meridian Atlas home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 4v32" stroke="currentColor" stroke-width="2"/><ellipse cx="20" cy="20" rx="7" ry="16" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 20h32" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>Meridian<br>Atlas</span>
    </a>
    <nav class="tabs-nav" aria-label="Sections">
      <a class="nav-link" href="#explore" data-view="explore"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span>Globe</span></a>
      <a class="nav-link" href="#course" data-view="course"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C7 4 9.5 4 12 6c2.5-2 5-2 8-.5v13c-3-1.5-5.5-1.5-8 .5-2.5-2-5-2-8-.5z"/><path d="M12 6v13"/></svg><span>Course</span></a>
      <a class="nav-link" href="#practice" data-view="practice"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg><span>Practice</span></a>
      <a class="nav-link" href="#index" data-view="index"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 3v18"/></svg><span>Index</span></a>
      <a class="nav-link" href="#progress" data-view="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progress</span></a>
    </nav>
    <div class="search" id="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="searchInput" type="search" placeholder="Find a country or capital" autocomplete="off" spellcheck="false" aria-label="Find a country or capital">
      <kbd>/</kbd>
      <ul class="search-results" id="searchResults" role="listbox" hidden></ul>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Switch to light mode" title="Switch to light mode">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="globe" id="globe" aria-label="Interactive globe. Drag to rotate, scroll to zoom, click a country to open it."></div>

    <div class="map-controls" id="mapControls">
      <label class="lens">
        <span>Colour by</span>
        <select id="lensSelect">
          <option value="region">Region</option>
          <option value="population">Population</option>
          <option value="density">Population density</option>
          <option value="gdpPc">Income per person</option>
          <option value="lifeExp">Life expectancy</option>
          <option value="fertility">Births per woman</option>
          <option value="mastery">What you know</option>
        </select>
      </label>
      <div class="layer-group" role="group" aria-label="Map layers">
        <button class="layer" id="toggleNames" aria-pressed="true">Names</button>
        <button class="layer" id="toggleCapitals" aria-pressed="false">Capitals</button>
        <button class="layer" id="togglePlates" aria-pressed="false">Plates</button>
        <button class="layer" id="toggleSatellite" aria-pressed="false">Satellite</button>
        <button class="layer" id="toggleSpin" aria-pressed="true">Rotate</button>
      </div>
    </div>

    <div class="legend" id="legend" aria-live="polite"></div>
    <div class="readout" id="readout" aria-hidden="true"></div>
    <div class="banner" id="banner" hidden></div>

    <aside class="panel" id="panel" aria-live="polite">
      <div class="panel-inner" id="panelInner"></div>
    </aside>

    <section class="sheet" id="sheet" hidden>
      <div class="sheet-inner" id="sheetInner"></div>
    </section>

    <div class="loading" id="loading">
      <div class="loading-mark">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse class="spin-ellipse" cx="20" cy="20" rx="6" ry="15" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </div>
      <p id="loadingText">Loading 250 countries</p>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/data.js"></script>
<script src="js/lessons.js"></script>
<script src="js/globe.js"></script>
<script src="js/dossier.js"></script>
<script src="js/course.js"></script>
<script src="js/practice.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
